[project]
name = "patchlet-worker"
version = "0.1.0"
description = "Patchlet workflow worker: files GitHub issues, drafts pull requests with Codestral, pauses for approval, merges and waits for the deployment."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mistralai-workflows==3.11.0",
    "requests>=2.32",
    "mcp>=1.9",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "responses>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
